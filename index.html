<!doctype html>
<html lang="en" class="blur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Board</title>
<style>
/* Sized from the screen height so it always fits one screen, no scrolling. 1080p -> 1rem = 16px.
   Dark glass panels over a wallpaper, same look as the start page. The blur is the one costly bit on
   the kiosk's Pentium G640; it only redraws when something under a panel changes, and Settings can
   turn it off (html.blur goes away and the panels get a bit more opaque instead). */
:root{
  --bg:#0f1115; --panel:rgba(16,18,23,.58); --line:rgba(255,255,255,.10); --shadow:0 8px 32px rgba(0,0,0,.28);
  --ink:#eceef1; --muted:#a0a6b1; --faint:#7a808b; --accent:#f0b84a; --today:rgba(56,92,150,.45); --warn:#f0b04a; --bad:#f19999;
  --dim:.3;
}
html:not(.blur){--panel:rgba(16,18,23,.74); --today:rgba(40,66,110,.78)}
html{font-size:1.48vh}
@media (max-aspect-ratio:4/3){html{font-size:1.1vw}}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
html,body{height:100%;overflow:hidden;color:var(--ink);
  font-family:"Inter","Noto Sans","DejaVu Sans","Segoe UI",sans-serif;cursor:none;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,36%);gap:1rem;padding:1.2rem 1.4rem}
.panel{border-radius:1rem;min-height:0;overflow:hidden}
.panel,.day,.wxcard{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
html.blur .panel,html.blur .day,html.blur .wxcard{-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
/* wallpaper: default is the start page's dark gradient */
#bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(1200px 700px at 15% 0%,#26324d 0%,transparent 60%),
  radial-gradient(900px 600px at 100% 100%,#2b2240 0%,transparent 55%),var(--bg);background-size:cover;background-position:center}
#bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}
.err{color:var(--bad);font-size:.95rem;padding:.6rem 0}

/* top row */
#top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:1.5rem;min-height:0}
#clockbox{text-shadow:0 2px 12px rgba(0,0,0,.55);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;padding:0 .4rem;justify-self:start;min-width:0}
#hello{min-width:0;max-width:100%;justify-self:end;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;padding:0 .4rem;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#greet{font-size:2.6rem;font-weight:600;letter-spacing:-.01em;line-height:1.12;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#quote{font-size:1.4rem;line-height:1.35;color:#dfe2e7;font-style:italic;margin-top:.5rem;max-width:100%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#quote:empty{display:none}
#apodcap{font-size:.95rem;color:#c9cdd4;margin-top:.35rem;max-width:24rem}
#apodcap div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#apodcap:empty{display:none}
#time{font-size:6.4rem;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
#time small{font-size:2.2rem;font-weight:500;color:#d4d8de;margin-left:.5rem;letter-spacing:0}
#date{font-size:1.9rem;color:#d4d8de;margin-top:.4rem}
#wx{display:flex;align-items:stretch;gap:.8rem}
.wxcard{border-radius:1rem;padding:.9rem 1.2rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:9.5rem}
.wxcard .d{font-size:1.15rem;color:var(--muted);font-weight:600}
.wxcard svg{width:3.6rem;height:3.6rem;margin:.3rem 0}
.wxcard .hl{font-size:1.6rem;font-weight:600}
.wxcard .hl span{color:var(--muted);font-weight:400}
.wxcard .r{font-size:1rem;color:#8cb8ff;margin-top:.15rem;min-height:1.2rem}
.wxnow{flex-direction:row;gap:1rem;min-width:0;padding:.9rem 1.4rem}
.wxnow svg{width:5rem;height:5rem;margin:0}
.wxnow .t{font-size:4rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.wxnow .tx{font-size:1.15rem;color:var(--muted);margin-top:.35rem;white-space:nowrap}
#wx.n5{gap:.6rem} #wx.n5 .wxcard:not(.wxnow){min-width:7.4rem;padding:.8rem .7rem}
#wx.n7{gap:.45rem} #wx.n7 .wxcard:not(.wxnow){min-width:5.9rem;padding:.7rem .45rem}
#wx.n7 .wxcard svg{width:3rem;height:3rem} #wx.n7 .wxcard .hl{font-size:1.35rem} #wx.n7 .wxcard .r{font-size:.9rem}
#wx.n7 .wxnow{padding:.8rem 1rem;gap:.8rem} #wx.n7 .wxnow svg{width:4.2rem;height:4.2rem} #wx.n7 .wxnow .t{font-size:3.4rem}
html.wxbare #wx .wxcard{background:none;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;text-shadow:0 2px 10px rgba(0,0,0,.65)}
html.wxbare #wx svg{filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
html.wxbare #wx .wxcard .d,html.wxbare #wx .wxnow .tx,html.wxbare #wx .hl span{color:#dfe2e7}

/* week */
#week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.6rem;min-height:0}
.day{border-radius:1rem;padding:.7rem .7rem .5rem;
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.day.past>*{opacity:.5}
.day.today{background:var(--today);border-color:rgba(120,160,230,.45)}
.day h2{font-size:1.25rem;font-weight:600;display:flex;align-items:baseline;gap:.45rem;margin-bottom:.5rem}
.day h2 b{font-size:2rem;line-height:1}
.day.today h2{color:var(--accent)}
.evs{display:flex;flex-direction:column;gap:.35rem;min-height:0;overflow:hidden;flex:1}
.ev{border-left:.3rem solid;padding:.2rem 0 .2rem .5rem;font-size:1.12rem;line-height:1.25;flex:none}
.ev .tm{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.ev .ti{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ev.all{border-left:0;border-radius:.4rem;padding:.25rem .5rem;color:#0f1115;font-weight:600}
.ev.all .ti{-webkit-line-clamp:1}
.more{font-size:.95rem;color:var(--muted);padding:.15rem 0 0 .5rem;flex:none}
.none{color:var(--faint);font-size:1rem}

/* bottom row */
#bottom{display:flex;gap:1rem;min-height:0}
#lists{flex:1;display:flex;gap:1rem;min-width:0;min-height:0}
.list{flex:1;min-width:0;padding:.9rem 1.1rem;display:flex;flex-direction:column}
.list h3{font-size:1.45rem;font-weight:600;display:flex;align-items:baseline;gap:.6rem;margin-bottom:.5rem}
.list h3 .u{font-size:.9rem;color:var(--faint);font-weight:400;margin-left:auto;white-space:nowrap}
.list h3 .u.stale{color:var(--warn)}
.items{list-style:none;min-height:0;overflow:hidden;flex:1;column-width:14rem;column-gap:1.6rem;column-fill:auto;height:100%}
.items li{font-size:1.2rem;line-height:1.3;padding:.22rem 0 .22rem 1.8rem;position:relative;break-inside:avoid;overflow-wrap:anywhere}
.items li::before{content:"";position:absolute;left:0;top:.42rem;width:.95rem;height:.95rem;box-sizing:border-box;border:2px solid var(--faint);border-radius:50%}
.items li.more{color:var(--muted);font-size:1.05rem}
.items li.more::before{display:none}
.empty{color:var(--faint);font-size:1.1rem}
.notes .items{column-width:18rem}
.notes .items li{padding:.3rem 0 .45rem .9rem;border-left:3px solid var(--nc,var(--faint));margin-bottom:.4rem;white-space:pre-line}
.notes .items li::before{display:none}
.notes .items li.more{border-left:0;padding-left:0}
.notes .who{display:block;white-space:normal;font-size:.95rem;color:var(--nc,var(--muted));margin-top:.15rem}
/* Party panel: everyone's level, XP bar and quests left today (from the family app's Quests) */
.party{flex:1.3}
.party .mem{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.4rem 1rem;padding:.45rem 0;border-bottom:1px solid var(--line)}
.party .mem:last-child{border-bottom:0}
.party .av{width:2.9rem;height:2.9rem;border-radius:50%;background:var(--mc);color:#0f1115;font-weight:800;font-size:1.4rem;display:grid;place-items:center;grid-row:span 2}
.party .nm{font-size:1.3rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party .nm span{font-size:1rem;color:var(--muted);font-weight:400;margin-left:.5rem}
.party .lv{font-size:1.05rem;color:var(--muted);text-align:right;white-space:nowrap}
.party .lv.done{color:#7fd6a4}
.party .xb{grid-column:2 / span 2;height:.55rem;border-radius:.3rem;background:rgba(255,255,255,.12);overflow:hidden}
.party .xb i{display:block;height:100%;background:var(--mc);border-radius:.3rem}
#levelup{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:20;text-align:center;padding:2.2rem 3.5rem;border-radius:1.4rem;
  background:rgba(16,18,23,.92);border:2px solid var(--lc,var(--accent));box-shadow:0 0 4rem rgba(0,0,0,.6);opacity:0;transition:opacity .4s;pointer-events:none}
#levelup.on{opacity:1}
#levelup b{display:block;font-size:1.6rem;letter-spacing:.3em;color:var(--lc,var(--accent))}
#levelup div{font-size:3.2rem;font-weight:700;margin-top:.4rem}
#levelup small{display:block;font-size:1.4rem;color:var(--muted);margin-top:.3rem}
/* "Calendar and list text size" setting: --ts scales these (1 = normal) */
:root{--ts:1}
.day h2{font-size:calc(1.25rem*var(--ts))} .day h2 b{font-size:calc(2rem*var(--ts))}
.ev{font-size:calc(1.12rem*var(--ts))} .ev .tm,.more{font-size:calc(.95rem*var(--ts))} .none{font-size:calc(1rem*var(--ts))}
.list h3{font-size:calc(1.45rem*var(--ts))} .list h3 .u{font-size:calc(.9rem*var(--ts))}
.items{column-width:calc(14rem*var(--ts))}
.items li{font-size:calc(1.2rem*var(--ts));padding-left:calc(1.8rem*var(--ts))}
.items li::before{top:calc(.42rem*var(--ts));width:calc(.95rem*var(--ts));height:calc(.95rem*var(--ts))}
.notes .items{column-width:calc(18rem*var(--ts))} .notes .items li{padding-left:calc(.9rem*var(--ts))} .notes .who{font-size:calc(.95rem*var(--ts))}
.items li.more{font-size:calc(1.05rem*var(--ts))} .empty{font-size:calc(1.1rem*var(--ts))}
#photo{position:relative;flex:none;aspect-ratio:3/2;height:100%}
/* portrait photos sit on the same dark glass as the other panels instead of black bars */
#photo[hidden]{display:none}
#photo img,#photo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s linear}
#photo img.on,#photo video.on{opacity:1}
#photo img.fit,#photo video.fit{object-fit:contain}
/* the Remote: a detail page a phone puts over the dashboard */
#remote{position:fixed;inset:1.2rem 1.4rem;z-index:15;border-radius:1.2rem;padding:1.5rem 2rem;background:#0e1014;border:1px solid var(--line);
  box-shadow:0 0 5rem rgba(0,0,0,.6);display:flex;flex-direction:column;gap:1.1rem;overflow:hidden}
#remote[hidden]{display:none}
#remote .rh{display:flex;align-items:baseline;gap:1.5rem}
#remote .rh h1{font-size:2.6rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#remote .rh span{font-size:1.1rem;color:var(--faint);white-space:nowrap}
#rBody{flex:1;min-height:0;display:flex;gap:1.5rem}
.rcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:1rem;min-height:0}
.rbox{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:1rem;padding:1.1rem 1.3rem;min-height:0;overflow:hidden}
.rbox h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:.7rem}
/* sheet */
.shead{display:flex;align-items:center;gap:1.4rem}
.shead .av{width:6rem;height:6rem;border-radius:50%;background:var(--mc);color:#0f1115;font-weight:800;font-size:3rem;display:grid;place-items:center;flex:none}
.shead .nm{font-size:2.4rem;font-weight:700}
.av.ph{background-size:cover;background-position:center;color:transparent}
.rh7{display:flex;align-items:center;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:1.3rem}
.rh7:last-child{border-bottom:0}
.rh7 .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh7 .d7{display:flex;gap:.35rem}
.rh7 .d7 i{width:.9rem;height:.9rem;border-radius:50%;background:rgba(255,255,255,.14)}
.rh7 .d7 i.on{background:#7fd6a4}
.rh7 small{color:var(--muted);font-size:1.05rem;white-space:nowrap;min-width:6.5rem;text-align:right}
.shead .cl{font-size:1.3rem;color:var(--muted)}
.shead .gd{margin-left:auto;font-size:1.8rem;font-weight:700;color:#f3cf6b;white-space:nowrap}
.rxb{height:.9rem;border-radius:.5rem;background:rgba(255,255,255,.12);overflow:hidden;margin-top:.6rem}
.rxb i{display:block;height:100%;background:var(--mc)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.sbx{border:1px solid var(--line);border-radius:1rem;text-align:center;padding:.9rem .4rem;background:rgba(0,0,0,.25)}
.sbx b{display:block;font-size:1.2rem;letter-spacing:.1em;color:var(--accent)}
.sbx div{font-size:3.2rem;font-weight:800;line-height:1.1}
.sbx span{display:inline-block;font-size:1.1rem;font-weight:700;border:1px solid var(--line);border-radius:1rem;padding:0 .7rem}
.sbx small{display:block;font-size:.95rem;color:var(--faint);margin-top:.3rem}
.rq{display:flex;align-items:center;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:1.35rem}
.rq:last-child{border-bottom:0}
.rq .ck{width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--faint);flex:none}
.rq.approved .ck{background:#7fd6a4;border-color:#7fd6a4}
.rq.pending .ck{border-color:var(--accent);border-style:dashed}
.rq.approved .tt{color:var(--faint)}
.rq .tt{flex:1;min-width:0}
.rq .tt small{display:block;font-size:1rem;color:var(--faint)}
.rq .xp{color:var(--muted);font-size:1.1rem;white-space:nowrap}
.rg{padding:.55rem 0;border-bottom:1px solid var(--line);font-size:1.35rem}
.rg:last-child{border-bottom:0}
.rg .gt{display:flex;gap:1rem;align-items:baseline}
.rg .gt span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg .gt small{font-size:1.05rem;color:var(--muted);white-space:nowrap}
.rg .rxb{margin-top:.4rem;height:.6rem}
.rg.claimed .gt span::after{content:" ★";color:#f5c542}
.rg.trophy .gt span::before{content:"🏆 "}
/* weather */
.wnow{display:flex;align-items:center;gap:2rem}
.wnow svg{width:9rem;height:9rem}
.wnow .t{font-size:6rem;font-weight:700;line-height:1}
.wnow .tx{font-size:1.6rem;color:var(--muted)}
.hours{display:grid;grid-template-columns:repeat(12,1fr);gap:.5rem;text-align:center}
.hours div{font-size:1.1rem;color:var(--muted)}
.hours svg{width:3.2rem;height:3.2rem;display:block;margin:.2rem auto}
.hours b{display:block;font-size:1.5rem;color:var(--ink)}
.wdays .wd{display:grid;grid-template-columns:7rem 3.5rem 1fr 8rem 8rem;align-items:center;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:1.4rem}
.wdays .wd:last-child{border-bottom:0}
.wdays svg{width:3rem;height:3rem}
.wdays .lo{color:var(--muted)}
/* month */
.mgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto;grid-auto-rows:1fr;gap:.4rem;min-height:0}
.mgrid .dh{font-size:1.1rem;color:var(--muted);text-align:center;padding-bottom:.2rem}
.mc{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:.6rem;padding:.3rem .45rem;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.mc.out{opacity:.35}
.mc.today{background:var(--today);border-color:rgba(120,160,230,.6)}
.mc b{font-size:1.15rem}
.mc .es{flex:1;min-height:0;overflow:hidden}
.mc .e{font-size:.95rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--ec,var(--faint));padding-left:.3rem;margin-top:.15rem}
.mc .e.more{border:0;color:var(--muted)}
/* one day */
.dl .de{display:flex;gap:1.5rem;padding:.8rem 0;border-bottom:1px solid var(--line);font-size:1.7rem}
.dl .de:last-child{border-bottom:0}
.dl .de .tm{width:11rem;color:var(--muted);flex:none}
.dl .de .ti{border-left:4px solid var(--ec,var(--faint));padding-left:1rem}
/* TV remote highlight */
.tvf{outline:.3rem solid var(--accent);outline-offset:.25rem;border-radius:1rem}
.party .mem.tvf{outline-offset:.1rem;border-radius:.6rem}
</style>
</head>
<body>
<div id="bg"></div>
<section id="top">
  <div id="clockbox"><div id="time">--:--</div><div id="date"></div><div id="apodcap"></div></div>
  <div id="wx"></div>
  <div id="hello"><div id="greet"></div><div id="quote"></div></div>
</section>
<section id="week"></section>
<section id="bottom">
  <div id="lists"></div>
  <div id="photo" class="panel" hidden><img alt=""><img alt=""><video muted loop playsinline preload="none"></video></div>
</section>

<div id="remote" hidden><div class="rh"><h1 id="rTitle"></h1><span id="rLeft"></span></div><div id="rBody"></div></div>
<div id="levelup"><b>LEVEL UP</b><div></div><small></small></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
// the timestamp keeps Android WebView (Fully Kiosk) from answering out of its own cache
const getJSON = url => fetch(url + (url.includes("?") ? "&" : "?") + "_=" + Date.now(), {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const PAGE_BUILD = "__PAGE_BUILD__";
let look = {bg_mode: "default", bg_url: "", bg_dim: 30, bg_every: 10, blur: true, photo_panel: true, photo_fill: false, photo_videos: false, wx_days: 3, wx_mono: false, wx_bare: false, text_scale: 100, color_rules: [], greet_name: "", quotes: "", quotes_only: false, msg_sound: true};
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

/* ---------- clock: repaint only when the minute changes */
let lastMin = "", lastDay = "";
function tick() {
  const now = new Date();
  const h = now.getHours(), m = pad(now.getMinutes());
  const key = h + ":" + m;
  if (key !== lastMin) {
    lastMin = key;
    $("time").innerHTML = "";
    $("time").append((h % 12 || 12) + ":" + m, el("small", null, h < 12 ? "AM" : "PM"));
    $("date").textContent = now.toLocaleDateString(undefined, {weekday: "long", month: "long", day: "numeric"});
    paintHello();
  }
  const day = ymd(now);
  if (lastDay && day !== lastDay) { loadWeek(); loadWeather(); }
  lastDay = day;
  // fresh page once a night: picks up changes and keeps Chromium's memory in check
  if (now.getHours() === 3 && now.getMinutes() === 30 && now.getSeconds() < 2)
    fetch("/healthz", {cache: "no-store"}).then(r => r.ok && location.reload()).catch(() => {}); // only if the server is up
}

/* ---------- greeting + a different affirmation each day (same one all day) */
const AFFIRMATIONS = [
  "You are loved more than you know.",
  "Today is a fresh start.",
  "Small steps still move you forward.",
  "You are allowed to take up space.",
  "Kindness you give comes back around.",
  "You've handled hard days before. You can handle this one.",
  "Progress, not perfection.",
  "This home is full of people who believe in you.",
  "Your best is enough, and it changes day to day.",
  "Be gentle with yourself today.",
  "You make this family better just by being in it.",
  "It's okay to rest. Rest is part of the work.",
  "Every day is a chance to try again.",
  "You are braver than you feel.",
  "Something good is going to happen today.",
  "Breathe in calm, breathe out worry.",
  "You don't have to do it all. Just the next thing.",
  "Laughter counts as a productive activity.",
  "You are growing, even when it doesn't feel like it.",
  "Choose the kind word.",
  "Mistakes are proof that you're trying.",
  "You are capable of amazing things.",
  "Gratitude turns what we have into enough.",
  "Your feelings are valid. All of them.",
  "Slow down. You're right on time.",
  "Today, look for the little things that go right.",
  "You bring light into every room you walk into.",
  "Asking for help is a strength.",
  "Be proud of how far you've come.",
  "There is always something to be thankful for.",
  "You are exactly who this family needs.",
  "Hard things become easier with practice.",
  "Your voice matters.",

/* ---------- trim a box's children until it fits, then add "+N more" */
function fit(box, makeMore) {
  const over = () => {
    const last = box.lastElementChild; if (!last) return false;
    const b = box.getBoundingClientRect(), r = last.getBoundingClientRect();
    return r.bottom > b.bottom + 1 || r.right > b.right + 1;
  };
  let hidden = 0, more = null;
  while (over()) {
    const k = Array.from(box.children).filter(x => x !== more);
    if (!k.length) break;
    k[k.length - 1].remove(); hidden++;
    if (!more) { more = makeMore(); box.append(more); }
    more.textContent = "+" + hidden + " more";
  }
}

/* Crop to fill the frame, keeping the people (Immich's face boxes) in view. A photo far off the frame's

  let lo = f ? (tall ? f.y1 : f.x1) : 0.5, hi = f ? (tall ? f.y2 : f.x2) : 0.5;
  // everyone doesn't fit: keep the biggest face (the subject) in view instead

  if (hi - lo > v) { const c = (lo + hi) / 2; lo = c - v / 2; hi = c + v / 2; }

let scr = {seq: -1}, scrSkew = 0;

function remoteLeft() {

function rbox(title) { const b = el("div", "rbox"); if (title) b.append(el("h3", null, title)); return b; }

const evColor = e => ruleColor(e.title) || e.color;

async function remoteMonth(box, ym) {

/* ---------- TV remote (Fully Kiosk on the Google TV passes the arrow and OK buttons to the page).
   Arrows move a highlight: weather, the seven days, then each party member. OK opens that page on this

   time; Back or OK again closes it. The highlight hides after 20 seconds without a key press. */
let tvRow = 0, tvCol = 0, tvT = null;
function tvRows() {
  const rows = [[$("wx")], [...document.querySelectorAll("#week .day")]];
  document.querySelectorAll("#lists .party .mem").forEach(m => rows.push([m]));
  return rows.filter(r => r.length && r[0]);
}
function tvPaint(show) {
  document.querySelectorAll(".tvf").forEach(e => e.classList.remove("tvf"));
  if (!show) return;
  const rows = tvRows(); if (!rows.length) return;
  tvRow = Math.max(0, Math.min(tvRow, rows.length - 1));
  tvCol = Math.max(0, Math.min(tvCol, rows[tvRow].length - 1));

function tvSend(page, arg) {
  fetch("/api/screen", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({page, arg: arg || "", by: "TV remote", secs: 300})})
    .then(r => r.json()).then(d => { if (!d.error) { scrSkew = Date.now() / 1000 - d.now; const ch = d.seq !== scr.seq; scr = d; if (ch) showRemote(); } }).catch(() => {});

function tvShift(step) {     // month and day pages: left/right go back and forward in time
  if (scr.page === "month") {
    const [y, m] = (scr.arg || ymd(new Date()).slice(0, 7)).split("-").map(Number), d = new Date(y, m - 1 + step, 1);
    tvSend("month", ymd(d).slice(0, 7));

document.addEventListener("keydown", e => {

    return;
  }
  if (back) { tvPaint(false); return; }
